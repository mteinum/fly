name: Test og publiser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Web - typesjekk og tester
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
      # 50 m-flisene ligger i git; tester som trenger 10 m-fliser eller rådata hoppes over her
      - name: Pipeline - tester
        working-directory: pipeline
        run: uv run pytest -q
      - name: Publiseringsskript - sperrer
        run: |
          bash -n deploy/deploy-cpanel.sh
          python3 -B -m unittest discover -s deploy -p 'test_*.py'
      # Delingssiden er PHP og kjører bare på webhotellet; her tegnes et diplom for å se at den virker
      - name: Delingsside - tegn et diplom
        run: bash deploy/test_share.sh share-test
      # Skipstjenesten er også PHP: tolking av AIS og UTM-formelen mot et opptak og Kartverkets fasitpunkter
      - name: Skipstjeneste - tolk et opptak av AIS-strømmen
        run: bash deploy/test_ais.sh ais-test
      - name: Flytjeneste - tolk lagrede svar fra adsb.lol
        run: bash deploy/test_traffic.sh traffic-test
      - name: Kollektivtjeneste - tolk et lagret svar fra Entur
        run: bash deploy/test_transit.sh transit-test
      - name: Værtjeneste - tolk METAR-er
        run: bash deploy/test_weather.sh weather-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diplom
          path: share-test/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://fly.teinum.no/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Rådata fra Kartverket (N50 for fire fylker, ca. 1 GB, pluss DTM og DOM). Caches så ikke hver
      # publisering laster alt på nytt.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: raw-${{ hashFiles('pipeline/src/flypipe/areas.py', 'pipeline/src/flypipe/dtm.py', 'pipeline/src/flypipe/n50.py') }}
          restore-keys: raw-
      - name: Bygg fliser for alle flyplasser
        working-directory: pipeline
        run: |
          uv run flypipe build all
          uv run pytest -q
      - name: Bygg spillet
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Publiser med SSH og rsync
        env:
          # Vert, bruker og sti er secrets, ikke variabler: da maskeres de i loggene, som er offentlige
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || '22' }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_SSH_PASSWORD }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: bash deploy/deploy-cpanel.sh --deploy
      - name: Kontroller at siden svarer
        run: |
          curl -fsS -o /dev/null -w 'index %{http_code}\n' https://fly.teinum.no/
          curl -fsS https://fly.teinum.no/data/kjevik10/metadata.json | python3 -c "import json,sys; m=json.load(sys.stdin); assert m['id']=='kjevik10' and m['cellSize']==10, m['id']; print('fliser', m['id'])"
          for area in sola10 flesland10 gardermoen10 bodo10; do curl -fsS -o /dev/null -w "$area %{http_code}\n" "https://fly.teinum.no/data/$area/metadata.json"; done
          curl -fsS -o /dev/null -w 'lyd %{http_code}\n' https://fly.teinum.no/audio/manifest.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://fly.teinum.no/)" = 301
